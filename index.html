<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>다올105 강의실 시간표</title>
<!-- 스마트 TV 전용 보기 화면. 오늘 강의실 시간표만 보여 주고 입력·이동 링크가 없다.
     2026-11-28 원장: 반 · 시간 · 강의실은 SYSTEM 반 시간표 하나가 기준(/api/ext/hallway) — SYSTEM 「복도 시간표」에서
     인포 · 원장이 강의실을 바꾸면 30초 안에 따라온다. 이날만 바꾸기 · 휴강 · 직보 · 설명회는 예전처럼 시간표 앱 월간 일정(ops_calendar).
     화면 그림(dayGridHTML)은 daol-timetable 원본을 그대로 불러온다.
     ?rotate=20     오늘↔내일을 20초마다 번갈아 보여줌
     ?d=2026-11-16  그 날짜로 고정
     ?zoom=0.9      배율 수동 지정 (없으면 화면에 맞춰 자동)
     ?embed=1       SYSTEM 화면 안에 끼워 보일 때(마우스 커서 보임, 새벽 새로고침 · 화면 켜 두기 안 함)
     점 색: 초록=SYSTEM 읽기 정상 · 월간 일정 실시간 / 주황=월간 일정 실시간 끊김(30초마다 다시 읽음) / 빨강=SYSTEM 을 못 읽음 -->
<style>
:root{--navy:#1e3a5f;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff;cursor:none}
body{font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;color:#1f2430}
#stage{position:absolute;inset:0;display:flex;flex-direction:column}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:14px 26px;
     background:var(--navy);color:#fff}
.bar .d{font-size:34px;font-weight:900;letter-spacing:-1px}
.bar .w{font-size:26px;font-weight:800;opacity:.9}
.bar .hol{font-size:20px;font-weight:800;background:#fee2e2;color:#991b1b;border-radius:8px;padding:4px 12px}
.bar .sp{flex:1}
.bar .clk{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.bar .tag{font-size:16px;font-weight:700;opacity:.75}
#fit{flex:1;position:relative;overflow:hidden}
#inner{position:absolute;top:0;left:0;transform-origin:top left;width:1500px}
.sheet{background:#fff}
.err{padding:40px;font-size:28px;color:#b91c1c;font-weight:800}
#dot{position:absolute;right:10px;bottom:8px;width:10px;height:10px;border-radius:50%;
     background:#22c55e;opacity:.55;transition:opacity .3s}
#dot.poll{background:#f59e0b;opacity:.9}
#dot.off{background:#ef4444;opacity:.9}
.rblk.conflict{outline:none!important}
.rblk.temp.conflict{border-color:#d97706!important}
/* 큰 글씨 강의실 그리드 — 그날 쓰는 강의실만 열로, 수업 있는 시간만 줄로 */
.tv{display:grid;background:#fff}
.tv .rh{height:64px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#1e3a5f;
        border-bottom:3px solid #1e3a5f;background:#f4f7fb;letter-spacing:-.5px}
.tv .rh small{font-size:18px;font-weight:700;color:#64748b;margin-left:6px}
.tv .ax{position:relative;border-right:2px solid #e2e8f0}
.tv .ax span{position:absolute;right:10px;transform:translateY(-50%);font-size:22px;font-weight:800;color:#94a3b8;font-variant-numeric:tabular-nums}
.tv .ax span.h0{transform:translateY(4px)}
.tv .col{position:relative;border-left:1px solid #e2e8f0;background-image:linear-gradient(#e2e8f0 1px,transparent 1px)}
.tv .b{position:absolute;left:6px;right:6px;border-radius:14px;padding:10px 14px;color:#fff;background:var(--c);overflow:hidden;
       display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 4px rgba(15,23,42,.12)}
.tv .b .n{font-size:28px;font-weight:900;line-height:1.15;letter-spacing:-.8px}
.tv .b .m{font-size:21px;font-weight:700;opacity:.92;font-variant-numeric:tabular-nums}
.tv .b .tg{align-self:flex-start;font-size:17px;font-weight:900;border-radius:7px;padding:1px 9px;background:rgba(255,255,255,.25)}
.tv .b.cl{background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 82%,#000);box-shadow:inset 8px 0 0 var(--c);padding-left:20px}
.tv .b.cl .tg{background:var(--c);color:#fff}
.tv .b.tmp{background:#fef3c7;color:#78350f;border:3px dashed #d97706;box-shadow:none}
.tv .b.tmp .tg{background:#d97706;color:#fff}
.tv .b.off{background:#e2e8f0;color:#64748b;box-shadow:none}
.tv .b.off .n{text-decoration:line-through}
.tv .b.off .tg{background:#64748b;color:#fff}
.tv .b.sm .m:last-of-type{display:none}
.tv .now{position:absolute;left:0;right:0;height:4px;background:#ef4444;z-index:5}
.tv .now::before{content:"";position:absolute;left:-7px;top:-6px;width:16px;height:16px;border-radius:50%;background:#ef4444}
.tv .none{grid-column:1/-1;padding:120px 0;text-align:center;font-size:40px;font-weight:900;color:#94a3b8}
</style>
</head>
<body>
<div id="stage">
  <div class="bar">
    <span class="d" id="bd">—</span><span class="w" id="bw"></span>
    <span class="sp"></span>
    <span class="tag">다올105 강의실 시간표</span>
    <span class="clk" id="clk">--:--</span>
  </div>
  <div id="fit"><div id="inner"></div></div>
</div>
<div id="dot" title="데이터 연결 상태"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/config.js"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/schedule-cal.js"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/exam-ops.js"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/rooms.js"></script>
<script>
const GRADE_ORDER = ["중1","중2","중3","중등공통","고1","고2","고3/수능"];
let DATA = [];
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const DOW = ["일","월","화","수","목","금","토"];
const dowOf = d => { const p=d.split("-").map(Number); return DOW[new Date(p[0],p[1]-1,p[2]).getDay()]; };
const md = d => (+d.slice(5,7))+"/"+(+d.slice(8,10));
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const n=new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; };
const addDays = (iso,k) => { const p=iso.split("-").map(Number); const x=new Date(p[0],p[1]-1,p[2]+k);
  return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };

const P = new URLSearchParams(location.search);
const PIN = P.get("d") || "";
const ROTATE = Math.max(0, parseInt(P.get("rotate")||"0",10));   // 초. 0이면 안 돌린다
const ZOOM = parseFloat(P.get("zoom")||"0") || 0;
const EMBED = P.get("embed")==="1";
if(EMBED){ document.documentElement.style.cursor="auto"; document.body.style.cursor="auto"; }
const BASEW = parseInt(P.get("w")||"1500",10) || 1500;   // 설계 폭

const cfg = window.DAOL_CONFIG || {};
const sb = (cfg.url && cfg.anonKey && window.supabase) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
const XO = window.DaolExamOps;
const SYSTEM_FEED = "https://daol105-system-two.vercel.app/api/ext/hallway";
const ROOM_KEYS = CLASS_ROOMS.map(r => r.key);
const toMin = t => { const m = /(\d{1,2}):(\d{2})/.exec(t || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; };

/* SYSTEM 반 → 이 화면이 쓰던 강좌 모양. 강의실은 SYSTEM 값 그대로, 「미정」만 예전 자동 배정 규칙으로 빈 방을 추천한다. */
function fromSystem(classes){
  return classes.map(c => ({ id: c.id, course_name: String(c.name || "").replace(/^\s*2\dY\s*/, ""), teacher: c.teacher || "",
    subject: c.subject || "", grade: c.grade || "", target_school: "", schedule_text: "", room_overrides: {}, sessions: c.sessions || [] }));
}
function assignDaySystem(day){
  const items = [], occ = {}; ROOM_KEYS.forEach(k => occ[k] = []);
  const tbd = [];
  DATA.forEach(c => c.sessions.forEach(s => {
    if (s.dow !== day) return;
    const a = toMin(s.start); if (a == null) return;
    const b = toMin(s.end); const end = b != null && b > a ? b : a + 90;
    const type = /클리닉|관리/.test(s.tag || "") ? "클리닉" : "정규";
    const it = { c, s: { day, start: a, end, type } };
    if (ROOM_KEYS.includes(s.room)) { it.room = s.room; occ[s.room].push(it.s); items.push(it); } else tbd.push(it);
  }));
  tbd.sort((x, y) => x.s.start - y.s.start).forEach(it => {
    const free = orderByPref(it.c.teacher, day, ROOM_KEYS).find(k => !occ[k].some(x => ovl(x, it.s)));
    it.room = free || ROOM_KEYS[0]; it.spill = true; occ[it.room].push(it.s); items.push(it);
  });
  return { items, unparsed: [] };
}
document.head.appendChild(Object.assign(document.createElement("style"), {textContent: DAOL_ROOM_GRID_CSS}));

let shown = null, flip = 0;
let live = false, pulling = false, again = false, ok = false;   // live: 실시간 연결됨
const dot = document.getElementById("dot");
function setDot(){
  dot.classList.toggle("off", !ok);
  dot.classList.toggle("poll", ok && !live);
  dot.title = !ok ? "데이터를 못 읽는 중" : live ? "실시간 연결됨" : "실시간 끊김 — 1분마다 다시 읽는 중";
}

function clock(){
  const n=new Date();
  document.getElementById("clk").textContent = pad(n.getHours())+":"+pad(n.getMinutes());
}
setInterval(clock, 10000); clock();

function targetDate(){
  if(PIN) return PIN;
  const t = todayISO();
  return (ROTATE && flip % 2) ? addDays(t,1) : t;      // 번갈아 보기
}

/* 큰 글씨 강의실 그리드 — 원장 11/28 「더 깔끔하고 글씨가 크게 잘 보이게」.
   XO.assignForDate 가 돌려준 그날 수업(SYSTEM) + 월간 일정 덧칸(직보 · 설명회 · 휴강 · 이날만 지정)을 그대로 쓴다. */
const SUBJ_TV = { "영어": "#15803d", "수학": "#1d4ed8", "국어": "#c2410c", "과학": "#7c3aed" };
const cleanName = s => String(s || "").replace(/^\s*2\dY\s*/, "").replace(/\s*-\s*정규\s*$|\s*정규반?\s*$/, "").replace(/\s+/g, " ").trim();
const hhmm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
function bigGridHTML(d, A){
  const blocks = [];
  A.items.forEach(it => blocks.push({ room: it.room, a: it.s.start, b: it.s.end, kind: it.off ? "off" : (it.s.type === "정규" ? "les" : "cl"),
    name: cleanName(it.c.course_name), who: it.c.teacher, c: SUBJ_TV[it.c.subject] || "#475569",
    tag: it.off ? "휴강" : it.overridden ? "이날만 이 방" : (it.s.type === "정규" ? "" : "클리닉") }));
  (A.temps || []).forEach(b => blocks.push({ room: b.room, a: b.start, b: b.end, kind: "tmp", name: cleanName(b.name), who: b.teacher || "",
    c: "#d97706", tag: RM_tempLabel(b.type) }));
  const shown = blocks.filter(x => x.room && x.a != null);
  if (!shown.length) return `<div class="tv"><div class="none">오늘은 수업이 없습니다</div></div>`;
  const rooms = CLASS_ROOMS.filter(r => shown.some(x => x.room === r.key));
  const from = Math.floor(Math.min(...shown.map(x => x.a)) / 60) * 60;
  const to = Math.ceil(Math.max(...shown.map(x => x.b)) / 60) * 60;
  const hours = (to - from) / 60, PX = Math.max(78, Math.min(140, Math.floor(760 / hours)));
  const H = hours * PX + 16;
  const lab = r => { const m = /^대치더올\s*(.*)$/.exec(r.label); return m ? `${m[1]}<small>대치</small>` : r.label; };
  let html = `<div class="tv" style="grid-template-columns:84px repeat(${rooms.length},1fr)"><div class="rh"></div>`;
  rooms.forEach(r => html += `<div class="rh">${lab(r)}</div>`);
  html += `<div class="ax" style="height:${H}px">`;
  for (let m = from; m <= to; m += 60) html += `<span class="${m === from ? "h0" : ""}" style="top:${(m - from) / 60 * PX}px">${m / 60}시</span>`;
  html += `</div>`;
  const nowM = (() => { if (d !== todayISO()) return null; const n = new Date(); const v = n.getHours() * 60 + n.getMinutes(); return v >= from && v <= to ? v : null; })();
  rooms.forEach(r => {
    html += `<div class="col" style="height:${H}px;background-size:100% ${PX}px">`;
    const list = shown.filter(x => x.room === r.key).sort((p, q) => p.a - q.a);
    list.forEach(x => {
      const top = (x.a - from) / 60 * PX + 3, h = (x.b - x.a) / 60 * PX - 6;
      html += `<div class="b ${x.kind === "les" ? "" : x.kind} ${h < 100 ? "sm" : ""}" style="--c:${x.c};top:${top}px;height:${h}px">` +
        `<div class="n">${esc(x.name)}</div>` +
        (x.tag ? `<span class="tg">${esc(x.tag)}</span>` : "") +
        `<div class="m">${hhmm(x.a)}–${hhmm(x.b)}</div>` +
        (x.who ? `<div class="m">${esc(x.who)} 선생님</div>` : "") + `</div>`;
    });
    if (nowM != null) html += `<div class="now" style="top:${(nowM - from) / 60 * PX}px"></div>`;
    html += `</div>`;
  });
  return html + `</div>`;
}

function paint(){
  const d = targetDate();
  let A;
  try { A = XO.assignForDate(d); }
  catch(e){ document.getElementById("inner").innerHTML = `<div class="err">일정을 불러오지 못했습니다</div>`; return; }
  const hn = XO.holidayOf(d);
  document.getElementById("bd").textContent = md(d);
  document.getElementById("bw").textContent = "(" + dowOf(d) + ")" + (d===todayISO() ? "" : " · 내일");
  document.getElementById("inner").innerHTML =
    `<div class="sheet">${bigGridHTML(d, A)}</div>`;
  shown = d;
  fit(); setTimeout(fit, 120);
}

/* 화면 크기에 맞춰 통째로 확대·축소 — TV 해상도가 뭐든 꽉 찬다 */
function fit(){
  const box = document.getElementById("fit"), inner = document.getElementById("inner");
  inner.style.width = BASEW + "px";
  inner.style.transform = "none"; inner.style.left = "0px";
  const w = BASEW, h = inner.offsetHeight;
  if(!h) return;
  const k = ZOOM || Math.min(box.clientWidth / w, box.clientHeight / h);
  inner.style.transform = `scale(${k})`;
  inner.style.left = Math.max(0, (box.clientWidth - w*k) / 2) + "px";
  inner.style.top  = Math.max(0, (box.clientHeight - h*k) / 2) + "px";
}
addEventListener("resize", ()=>{ fit(); setTimeout(fit,250); });

async function pull(){
  if(pulling){ again = true; return; }
  pulling = true; again = false;
  try{
    const r = await fetch(SYSTEM_FEED, { cache: "no-store" });   // 수업 중 반의 이름 · 선생님 · 과목 · 학년 · 시간 · 강의실만
    const j = await r.json();
    if(!r.ok || !j.ok) throw new Error(j.error || r.status);
    DATA = fromSystem(j.classes || []);
    XO.init({ sb, teachers:[], rooms:CLASS_ROOMS, assignDay: assignDaySystem, orderByPref,
              getCourses: ()=>DATA, onChange: ()=>paint() });
    if(PIN && XO.setView) XO.setView(PIN.slice(0,7));
    if(sb) await XO.load();   // 월간 일정(이날만 · 휴강 · 직보 · 설명회) — 못 읽어도 SYSTEM 시간표는 그린다
    ok = true; setDot();
    paint();
  }catch(e){ ok = false; setDot(); }
  finally{ pulling = false; if(again) setTimeout(pull, 300); }
}

/* 실시간 알림 — 시간표(courses)나 월간 일정(ops_calendar)이 바뀌면 바로 다시 읽는다.
   끊기거나 오류면 live=false 로 돌아가 아래의 1분 다시 읽기가 그대로 맡는다. */
let rtTimer = null;
function onChanged(){ clearTimeout(rtTimer); rtTimer = setTimeout(pull, 700); }   // 연달아 바뀌어도 한 번만
function startRealtime(){
  if(!sb || !sb.channel) return;
  try{
    sb.channel("tv-live-" + Math.random().toString(36).slice(2,8))
      .on("postgres_changes", {event:"*", schema:"public", table:"ops_calendar"}, onChanged)
      .subscribe(status => { live = (status === "SUBSCRIBED"); setDot(); });
  }catch(e){ live = false; setDot(); }
}

/* 1분마다 데이터 다시 읽고, 자정이 지나면 날짜가 저절로 넘어간다 */
setInterval(pull, 30*1000);   // SYSTEM 시간표는 30초마다 다시 읽는다(SYSTEM 쪽 캐시도 30초)
setInterval(()=>{ if(!PIN && shown && shown !== targetDate()) paint(); }, 20*1000);
setInterval(()=>{ if(ok) paint(); }, 60*1000);   // 빨간 「지금」 선을 1분마다 옮긴다
if(ROTATE) setInterval(()=>{ flip++; paint(); }, ROTATE*1000);
/* 하루 한 번(새벽 4시대) 통째로 새로고침 — 코드가 바뀌어도 알아서 따라온다 */
if(!EMBED) setInterval(()=>{ const n=new Date(); if(n.getHours()===4 && n.getMinutes()<2) location.reload(); }, 60*1000);

/* TV가 화면을 끄지 않게 */
if(!EMBED) (async()=>{ try{ if(navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} })();
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState === "visible"){
    if(!EMBED){ try{ if(navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} }
    pull();
  }
});

startRealtime();
pull();
</script>
</body>
</html>
