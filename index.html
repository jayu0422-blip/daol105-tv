<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- 글꼴 — SYSTEM(src/app/layout.tsx)과 같은 Pretendard Variable 을 같은 주소에서 불러온다(원장 11/28 「사이드바와 같은 폰트」) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>다올105 강의실 시간표</title>
<!-- 스마트 TV 전용 보기 화면. 오늘 강의실 시간표만 보여 주고 입력·이동 링크가 없다.
     2026-11-28 원장: 반 · 시간 · 강의실은 SYSTEM 반 시간표 하나가 기준(/api/ext/hallway) — SYSTEM 「복도 시간표」에서
     인포 · 원장이 강의실을 바꾸면 30초 안에 따라온다. 이날만 바꾸기 · 휴강 · 직보 · 설명회는 예전처럼 시간표 앱 월간 일정(ops_calendar).
     화면 그림(dayGridHTML)은 daol-timetable 원본을 그대로 불러온다.
     ?rotate=20     오늘↔내일을 20초마다 번갈아 보여줌
     ?d=2026-11-16  그 날짜로 고정
     ?zoom=0.9      배율 수동 지정 (없으면 화면에 맞춰 자동)
     ?year=2027     2027 시간표(개강 전 반 포함) 미리보기 — 2027-01-04 부터는 저절로 2027 (원장 11/28 「위 시간표는 1월 시간표」)
     ?embed=1       SYSTEM 화면 안에 끼워 보일 때(마우스 커서 보임, 새벽 새로고침 · 화면 켜 두기 안 함)
     점 색: 초록=SYSTEM 읽기 정상 · 월간 일정 실시간 / 주황=월간 일정 실시간 끊김(30초마다 다시 읽음) / 빨강=SYSTEM 을 못 읽음 -->
<style>
:root{--navy:#1B2A3A;--line:#E1E5E9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff;cursor:none}
body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;color:#1A1D21}
#stage{position:absolute;inset:0;display:flex;flex-direction:column}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:14px 26px;
     background:var(--navy);color:#fff}
.bar .d{font-size:34px;font-weight:800;letter-spacing:-1px}
.bar .w{font-size:26px;font-weight:800;opacity:.9}
.bar .hol{font-size:20px;font-weight:800;background:#FBE7E7;color:#9B2C2C;padding:4px 12px}
.bar .sp{flex:1}
.bar .clk{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.bar .tag{font-size:16px;font-weight:700;opacity:.75}
.bar .pv{font-size:20px;font-weight:800;background:#F3EADF;color:#8A5A0B;padding:4px 12px}
#fit{flex:1;position:relative;overflow:hidden}
#inner{position:absolute;top:0;left:0;transform-origin:top left;width:1500px}
.sheet{background:#fff}
.err{padding:40px;font-size:28px;color:#b91c1c;font-weight:800}
#dot{position:absolute;right:10px;bottom:8px;width:10px;height:10px;
     background:#22c55e;opacity:.55;transition:opacity .3s}
#dot.poll{background:#f59e0b;opacity:.9}
#dot.off{background:#ef4444;opacity:.9}
.rblk.conflict{outline:none!important}
.rblk.temp.conflict{border-color:#d97706!important}
/* SYSTEM 화면 규칙에 맞춘 강의실 그리드 — 원장 11/28 「우리 UI 디자인과 싱크가 정확히 맞게」.
   각진 모서리(SYSTEM 전체 규칙 2026-08-31) · 중립 회색 선 · 과목 색은 SYSTEM tokens.SUBJECT(수학 info · 영어 success · 국어 warning · 과학 purple).
   화면을 확대 · 축소하지 않고 TV 크기 그대로 꽉 채운다(글자는 화면 높이 기준 vh). */
*,*::before,*::after{border-radius:0!important}
.tv{display:grid;background:#fff;width:100%}
.tv .gh{height:5.2vh;display:flex;align-items:center;padding:0 1.2vh;font-size:2.1vh;font-weight:800;letter-spacing:-.02em;
        color:#fff;background:#26374A;border-right:2px solid #fff}
.tv .gh.dc{background:#3A5A8C}
.tv .gh small{font-size:1.5vh;font-weight:600;opacity:.8;margin-left:.8vh}
.tv .rh{height:5.6vh;display:flex;align-items:center;justify-content:center;font-size:2.7vh;font-weight:800;color:#1A1D21;
        background:#F8F9FA;border-bottom:2px solid #26374A;border-left:1px solid #E1E5E9;letter-spacing:-.03em}
.tv .ax{position:relative;border-right:1px solid #E1E5E9;background:#fff}
.tv .ax span{position:absolute;right:1vh;transform:translateY(-50%);font-size:1.9vh;font-weight:700;color:#727A85;font-variant-numeric:tabular-nums}
.tv .ax span.h0{transform:translateY(.4vh)}
.tv .col{position:relative;border-left:1px solid #E1E5E9;background-image:linear-gradient(#E1E5E9 1px,transparent 1px),linear-gradient(#F1F3F5 1px,transparent 1px)}
.tv .col.dc{background-color:#FBFCFE}
.tv .col .emp{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:2vh;font-weight:700;color:#C2C8CF}
.tv .b{position:absolute;left:.5vh;right:.5vh;padding:.9vh 1.2vh .9vh 1.6vh;overflow:hidden;display:flex;flex-direction:column;gap:.35vh;
       background:var(--bg);border:0;color:var(--tx)}   /* 원장 11/28: 왼쪽 막대 없이 배경색만 사각으로 */
.tv .b .n{font-size:2.6vh;font-weight:800;line-height:1.15;letter-spacing:-.04em;color:#1A1D21}
.tv .b .m{font-size:1.95vh;font-weight:600;color:#3E444C;font-variant-numeric:tabular-nums}
.tv .b .tg{align-self:flex-start;font-size:1.55vh;font-weight:700;padding:.1vh .8vh;background:#fff;color:var(--tx);border:1px solid var(--bd)}
.tv .b.cl{background:#fff;border:1px solid var(--bd)}   /* 클리닉 = 흰 칸 + 과목 색 테두리 */
.tv .b.cl .tg{background:var(--bg)}
.tv .b.opt{background:#fff;border:2px dashed var(--base)}
.tv .b.tmp{background:#F3EADF;border:2px dashed #B07A2E;color:#8A5A0B}
.tv .b.off{background:#F1F3F5;border-color:#E1E5E9;border-left-color:#98A0AA;color:#727A85}
.tv .b.off .n{text-decoration:line-through;color:#727A85}
.tv .b.live{box-shadow:inset 0 0 0 2px #1F4A36}
.tv .b .tg.lv{background:#1F4A36;color:#fff;border-color:#1F4A36}
.tv .b.sm .m:last-of-type{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="bar">
    <span class="d" id="bd">—</span><span class="w" id="bw"></span>
    <span class="sp"></span>
    <span class="pv" id="pv" hidden>2027 1월 시간표 미리보기</span>
    <span class="tag">다올105 강의실 시간표</span>
    <span class="clk" id="clk">--:--</span>
  </div>
  <div id="fit"><div id="inner"></div></div>
</div>
<div id="dot" title="데이터 연결 상태"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/config.js"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/schedule-cal.js"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/exam-ops.js"></script>
<script src="https://jayu0422-blip.github.io/daol-timetable/rooms.js"></script>
<script>
const GRADE_ORDER = ["중1","중2","중3","중등공통","고1","고2","고3/수능"];
let DATA = [];
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const DOW = ["일","월","화","수","목","금","토"];
const dowOf = d => { const p=d.split("-").map(Number); return DOW[new Date(p[0],p[1]-1,p[2]).getDay()]; };
const md = d => (+d.slice(5,7))+"/"+(+d.slice(8,10));
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const n=new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; };
const addDays = (iso,k) => { const p=iso.split("-").map(Number); const x=new Date(p[0],p[1]-1,p[2]+k);
  return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };

const P = new URLSearchParams(location.search);
const PIN = P.get("d") || "";
const ROTATE = Math.max(0, parseInt(P.get("rotate")||"0",10));   // 초. 0이면 안 돌린다
const ZOOM = parseFloat(P.get("zoom")||"0") || 0;
const EMBED = P.get("embed")==="1";
if(EMBED){ document.documentElement.style.cursor="auto"; document.body.style.cursor="auto"; }
const BASEW = parseInt(P.get("w")||"1500",10) || 1500;   // 설계 폭

const cfg = window.DAOL_CONFIG || {};
const sb = (cfg.url && cfg.anonKey && window.supabase) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
const XO = window.DaolExamOps;
const FEED_Q = P.get("feed") || "";
const SYSTEM_FEED = /^http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/ext\/hallway$/.test(FEED_Q) ? FEED_Q : "https://daol105-system-two.vercel.app/api/ext/hallway";
/* 2027-01-04(월)부터 2027 반으로 넘어간다. 그 전엔 ?year=2027 로만 미리 본다(상단 노란 「미리보기」 표시). */
const SWITCH_DAY = "2027-01-04";
const feedYear = () => P.get("year") === "2027" ? "2027" : ((PIN || todayISO()) >= SWITCH_DAY ? "2027" : "");
const ROOM_KEYS = CLASS_ROOMS.map(r => r.key);
const toMin = t => { const m = /(\d{1,2}):(\d{2})/.exec(t || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; };

/* SYSTEM 반 → 이 화면이 쓰던 강좌 모양. 강의실은 SYSTEM 값 그대로, 「미정」만 예전 자동 배정 규칙으로 빈 방을 추천한다. */
function fromSystem(classes){
  return classes.map(c => ({ id: c.id, course_name: String(c.name || "").replace(/^\s*2\dY\s*/, ""), teacher: c.teacher || "",
    subject: c.subject || "", grade: c.grade || "", target_school: "", schedule_text: "", room_overrides: {}, sessions: c.sessions || [] }));
}
function assignDaySystem(day){
  const items = [], occ = {}; ROOM_KEYS.forEach(k => occ[k] = []);
  const tbd = [];
  DATA.forEach(c => c.sessions.forEach(s => {
    if (s.dow !== day) return;
    const a = toMin(s.start); if (a == null) return;
    const b = toMin(s.end); const end = b != null && b > a ? b : a + 90;
    const type = /클리닉|관리/.test(s.tag || "") ? "클리닉" : /컨설팅|신청/.test(s.tag || "") ? "신청" : "정규";
    const it = { c, s: { day, start: a, end, type } };
    if (ROOM_KEYS.includes(s.room)) { it.room = s.room; occ[s.room].push(it.s); items.push(it); } else tbd.push(it);
  }));
  tbd.sort((x, y) => x.s.start - y.s.start).forEach(it => {
    const free = orderByPref(it.c.teacher, day, ROOM_KEYS).find(k => !occ[k].some(x => ovl(x, it.s)));
    it.room = free || ROOM_KEYS[0]; it.spill = true; occ[it.room].push(it.s); items.push(it);
  });
  return { items, unparsed: [] };
}
document.head.appendChild(Object.assign(document.createElement("style"), {textContent: DAOL_ROOM_GRID_CSS}));

let shown = null, flip = 0;
let live = false, pulling = false, again = false, ok = false;   // live: 실시간 연결됨
const dot = document.getElementById("dot");
function setDot(){
  dot.classList.toggle("off", !ok);
  dot.classList.toggle("poll", ok && !live);
  dot.title = !ok ? "데이터를 못 읽는 중" : live ? "실시간 연결됨" : "실시간 끊김 — 1분마다 다시 읽는 중";
}

function clock(){
  const n=new Date();
  document.getElementById("clk").textContent = pad(n.getHours())+":"+pad(n.getMinutes());
}
setInterval(clock, 10000); clock();

function targetDate(){
  if(PIN) return PIN;
  const t = todayISO();
  return (ROTATE && flip % 2) ? addDays(t,1) : t;      // 번갈아 보기
}

/* SYSTEM 규칙 강의실 그리드 — 원장 11/28 「대치더올은 왜 없나 · 여백이 너무 많다 · 빨간 줄은 왜 · 둥근 칸 말고 우리 UI 와 맞게」.
   · 다올105 · 대치더올 강의실을 늘 같은 자리에 보인다(수업이 없으면 「수업 없음」).
   · TV 화면 크기 그대로 꽉 채운다(확대 · 축소 없음, 1시간 높이 = 남은 높이 ÷ 시간 수).
   · 빨간 「지금」 선 대신 지금 하는 수업 칸에 「지금 수업 중」 표시.
   XO.assignForDate 가 돌려준 그날 수업(SYSTEM) + 월간 일정 덧칸(직보 · 설명회 · 휴강 · 이날만 지정)을 그대로 쓴다. */
const TONE = {   // SYSTEM src/app/_ui/tokens.ts 과목 색(SUBJECT) 그대로
  "수학": { tx: "#2C4A78", bg: "#E7EDF7", base: "#3A5A8C", bd: "#CBD9EC" },
  "영어": { tx: "#276749", bg: "#E3F0E7", base: "#3E7C63", bd: "#CFE2D6" },
  "국어": { tx: "#8A5A0B", bg: "#F3EADF", base: "#B07A2E", bd: "#EADFCB" },
  "과학": { tx: "#5B3B8C", bg: "#EFE6F7", base: "#7C5BB8", bd: "#DFD0EE" },
};
const TONE_X = { tx: "#565D66", bg: "#F1F3F5", base: "#98A0AA", bd: "#E1E5E9" };
const toneVars = s => { const o = TONE[s] || TONE_X; return `--tx:${o.tx};--bg:${o.bg};--base:${o.base};--bd:${o.bd}`; };
const cleanName = s => String(s || "").replace(/\s*\(\s*조교\s*\)|조교\s*/g, "").replace(/^\s*2\dY\s*/, "").replace(/\s*-\s*정규\s*$|\s*정규반?\s*$/, "").replace(/\s+/g, " ").trim();
const hhmm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const ALWAYS = ["본관1", "본관2", "본관3", "스터디홀", "대치1", "대치2", "대치클리닉"];   // 늘 보이는 강의실(복도 · 상담실은 쓸 때만)
function bigGridHTML(d, A){
  const tbd = it => (it.c.sessions || []).some(s => s.dow === dowOf(d) && toMin(s.start) === it.s.start && !ROOM_KEYS.includes(s.room));
  const nowM = d === todayISO() ? (() => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); })() : null;
  const blocks = [];
  A.items.forEach(it => {
    const live = !it.off && nowM != null && it.s.start <= nowM && nowM < it.s.end;
    blocks.push({ room: it.room, a: it.s.start, b: it.s.end, subj: it.c.subject, live,
      kind: it.off ? "off" : it.s.type === "정규" ? "les" : it.s.type === "신청" ? "opt" : "cl",
      name: cleanName(it.c.course_name), who: cleanName(it.c.teacher),
      tag: it.off ? "휴강" : live ? "지금 수업 중" : it.overridden ? "이날만 이 방" : it.s.type === "신청" ? "신청자만" : tbd(it) ? "교실 미정" : (it.s.type === "정규" ? "" : "클리닉") });
  });
  (A.temps || []).forEach(b => blocks.push({ room: b.room, a: b.start, b: b.end, kind: "tmp", name: cleanName(b.name), who: cleanName(b.teacher || ""), tag: RM_tempLabel(b.type) }));
  const shown = blocks.filter(x => x.room && x.a != null);
  const rooms = CLASS_ROOMS.filter(r => ALWAYS.includes(r.key) || shown.some(x => x.room === r.key));
  const daol = rooms.filter(r => r.bldg !== "대치더올"), dc = rooms.filter(r => r.bldg === "대치더올");
  const cols = [...daol, ...dc];
  const from = shown.length ? Math.floor(Math.min(...shown.map(x => x.a)) / 60) * 60 : 14 * 60;
  const to = shown.length ? Math.ceil(Math.max(...shown.map(x => x.b)) / 60) * 60 : 22 * 60;
  const hours = Math.max(1, (to - from) / 60);
  const vh = window.innerHeight / 100, box = document.getElementById("fit");
  const head = 5.2 * vh + 5.6 * vh + 4;
  const PX = Math.max(36, Math.floor(((box ? box.clientHeight : window.innerHeight) - head - 2 * vh) / hours));
  const H = hours * PX + 2 * vh;
  const lab = r => r.label.replace(/^대치더올\s*/, "");
  let html = `<div class="tv" style="grid-template-columns:7vh repeat(${cols.length},1fr)"><div class="gh" style="background:#fff"></div>`;
  if (daol.length) html += `<div class="gh" style="grid-column:span ${daol.length}">다올105<small>미사</small></div>`;
  if (dc.length) html += `<div class="gh dc" style="grid-column:span ${dc.length}">대치더올<small>수학 · 과학</small></div>`;
  html += `<div class="rh" style="border-left:none"></div>`;
  cols.forEach(r => html += `<div class="rh">${lab(r)}</div>`);
  html += `<div class="ax" style="height:${H}px">`;
  for (let m = from; m <= to; m += 60) html += `<span class="${m === from ? "h0" : ""}" style="top:${(m - from) / 60 * PX}px">${m / 60}시</span>`;
  html += `</div>`;
  cols.forEach(r => {
    const list = shown.filter(x => x.room === r.key).sort((p, q) => p.a - q.a);
    html += `<div class="col ${r.bldg === "대치더올" ? "dc" : ""}" style="height:${H}px;background-size:100% ${PX}px,100% ${PX}px;background-position:0 0,0 ${PX / 2}px">`;
    if (!list.length) html += `<div class="emp">수업 없음</div>`;
    list.forEach(x => {
      const top = (x.a - from) / 60 * PX + 2, h = (x.b - x.a) / 60 * PX - 4;
      html += `<div class="b ${x.kind === "les" ? "" : x.kind} ${x.live ? "live" : ""} ${h < 11 * vh ? "sm" : ""}" style="${toneVars(x.subj)};top:${top}px;height:${h}px">` +
        `<div class="n">${esc(x.name)}</div>` +
        (x.tag ? `<span class="tg ${x.live ? "lv" : ""}">${esc(x.tag)}</span>` : "") +
        `<div class="m">${hhmm(x.a)}–${hhmm(x.b)}</div>` +
        (x.who ? `<div class="m">${esc(x.who)} 선생님</div>` : "") + `</div>`;
    });
    html += `</div>`;
  });
  return html + `</div>`;
}

function paint(){
  const d = targetDate();
  let A;
  try { A = XO.assignForDate(d); }
  catch(e){ document.getElementById("inner").innerHTML = `<div class="err">일정을 불러오지 못했습니다</div>`; return; }
  const hn = XO.holidayOf(d);
  document.getElementById("bd").textContent = md(d);
  document.getElementById("bw").textContent = "(" + dowOf(d) + ")" + (d===todayISO() ? "" : d===addDays(todayISO(),1) ? " · 내일" : "");
  document.getElementById("inner").innerHTML =
    `<div class="sheet">${bigGridHTML(d, A)}</div>`;
  shown = d;
  fit(); setTimeout(fit, 120);
}

/* 화면 크기에 맞춰 통째로 확대·축소 — TV 해상도가 뭐든 꽉 찬다 */
function fit(){
  const box = document.getElementById("fit"), inner = document.getElementById("inner");
  if (inner.querySelector(".tv")) {   // SYSTEM 규칙 그리드는 TV 크기 그대로 그린다(여백 없음)
    inner.style.width = box.clientWidth + "px"; inner.style.transform = "none"; inner.style.left = "0px"; inner.style.top = "0px";
    return;
  }
  inner.style.width = BASEW + "px";
  inner.style.transform = "none"; inner.style.left = "0px";
  const w = BASEW, h = inner.offsetHeight;
  if(!h) return;
  const k = ZOOM || Math.min(box.clientWidth / w, box.clientHeight / h);
  inner.style.transform = `scale(${k})`;
  inner.style.left = Math.max(0, (box.clientWidth - w*k) / 2) + "px";
  inner.style.top  = Math.max(0, (box.clientHeight - h*k) / 2) + "px";
}
addEventListener("resize", ()=>{ if(ok) paint(); else fit(); });

async function pull(){
  if(pulling){ again = true; return; }
  pulling = true; again = false;
  try{
    const fy = feedYear();
    const r = await fetch(SYSTEM_FEED + (fy ? `?year=${fy}` : ""), { cache: "no-store" });   // 수업 중(1월부터 2027) 반의 이름 · 선생님 · 과목 · 학년 · 시간 · 강의실만
    const pv = document.getElementById("pv"); if (pv) pv.hidden = !(fy && todayISO() < SWITCH_DAY);
    const j = await r.json();
    if(!r.ok || !j.ok) throw new Error(j.error || r.status);
    DATA = fromSystem(j.classes || []);
    XO.init({ sb, teachers:[], rooms:CLASS_ROOMS, assignDay: assignDaySystem, orderByPref,
              getCourses: ()=>DATA, onChange: ()=>paint() });
    if(PIN && XO.setView) XO.setView(PIN.slice(0,7));
    if(sb) await XO.load();   // 월간 일정(이날만 · 휴강 · 직보 · 설명회) — 못 읽어도 SYSTEM 시간표는 그린다
    ok = true; setDot();
    paint();
  }catch(e){ ok = false; setDot(); }
  finally{ pulling = false; if(again) setTimeout(pull, 300); }
}

/* 실시간 알림 — 시간표(courses)나 월간 일정(ops_calendar)이 바뀌면 바로 다시 읽는다.
   끊기거나 오류면 live=false 로 돌아가 아래의 1분 다시 읽기가 그대로 맡는다. */
let rtTimer = null;
function onChanged(){ clearTimeout(rtTimer); rtTimer = setTimeout(pull, 700); }   // 연달아 바뀌어도 한 번만
function startRealtime(){
  if(!sb || !sb.channel) return;
  try{
    sb.channel("tv-live-" + Math.random().toString(36).slice(2,8))
      .on("postgres_changes", {event:"*", schema:"public", table:"ops_calendar"}, onChanged)
      .subscribe(status => { live = (status === "SUBSCRIBED"); setDot(); });
  }catch(e){ live = false; setDot(); }
}

/* 1분마다 데이터 다시 읽고, 자정이 지나면 날짜가 저절로 넘어간다 */
setInterval(pull, 30*1000);   // SYSTEM 시간표는 30초마다 다시 읽는다(SYSTEM 쪽 캐시도 30초)
setInterval(()=>{ if(!PIN && shown && shown !== targetDate()) paint(); }, 20*1000);
setInterval(()=>{ if(ok) paint(); }, 60*1000);   // 빨간 「지금」 선을 1분마다 옮긴다
if(ROTATE) setInterval(()=>{ flip++; paint(); }, ROTATE*1000);
/* 하루 한 번(새벽 4시대) 통째로 새로고침 — 코드가 바뀌어도 알아서 따라온다 */
if(!EMBED) setInterval(()=>{ const n=new Date(); if(n.getHours()===4 && n.getMinutes()<2) location.reload(); }, 60*1000);

/* TV가 화면을 끄지 않게 */
if(!EMBED) (async()=>{ try{ if(navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} })();
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState === "visible"){
    if(!EMBED){ try{ if(navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} }
    pull();
  }
});

startRealtime();
pull();
</script>
